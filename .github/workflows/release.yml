name: Release

# Construye y sube ghcr.io/cpu-commits/muelle y ghcr.io/cpu-commits/muelle-caddy
# con el tag de git (contrato §5.4), después de los mismos tests que CI. Las
# dos imágenes llevan el mismo tag vX.Y.Z[-sufijo]; :latest solo muelle, y solo
# las versiones finales. Con workflow_dispatch construye sin subir (para probar
# los Dockerfile). Los paquetes de GHCR son públicos: los crea el primer
# release con la visibilidad del repo.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Los jobs de ci.yaml tal cual: Go (gofmt, go mod tidy, vet, test -race, -tags panel),
    # el panel (verify, build y e2e), Go con el build de verdad del panel y el e2e real.
    uses: ./.github/workflows/ci.yaml

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Las actions van fijadas por SHA de commit: este job puede subir paquetes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: versión y tags
        id: v
        # El tag se lee de GITHUB_REF_NAME, nunca con ${{ }} dentro del script.
        run: |
          # Solo un push de un tag sube; workflow_dispatch nunca (aunque se elija un tag).
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/* ]]; then
            v="$GITHUB_REF_NAME"; push=true
            # El mismo formato que naming.MuelleImageFor.
            if [[ ! "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::el tag no es vX.Y.Z[-sufijo]"
              exit 1
            fi
          else
            v=dev; push=false
          fi
          muelle="ghcr.io/cpu-commits/muelle:$v"
          if [[ "$push" == true && "$v" != *-* ]]; then
            muelle="$muelle,ghcr.io/cpu-commits/muelle:latest"
          fi
          {
            echo "version=$v"
            echo "push=$push"
            echo "muelle=$muelle"
            echo "caddy=ghcr.io/cpu-commits/muelle-caddy:$v"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.v.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: muelle
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: VERSION=${{ steps.v.outputs.version }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.v.outputs.muelle }}
          push: ${{ steps.v.outputs.push == 'true' }}
          cache-from: type=gha,scope=muelle
          cache-to: type=gha,mode=max,scope=muelle
      - name: muelle-caddy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/caddy
          platforms: linux/amd64
          build-args: VERSION=${{ steps.v.outputs.version }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.v.outputs.caddy }}
          push: ${{ steps.v.outputs.push == 'true' }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy
