name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml corre estos mismos tests antes de construir las imágenes.
  workflow_call:

permissions:
  contents: read

# Las actions van fijadas por SHA de commit, como en release.yml: un tag de release corre
# estos jobs en la misma corrida que construye y sube las imágenes, con la caché de GHA que
# cualquier job de la corrida puede escribir. Al subir una versión, el SHA y su comentario.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: go mod tidy
        run: go mod tidy -diff
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: build
        run: CGO_ENABLED=0 go build -o muelle .
      # Un build de prueba de dos archivos: este job no espera al de web. El panel de
      # verdad lo embebe el job "panel".
      - name: panel embebido (-tags panel, con un build de prueba)
        run: |
          mkdir -p src/cmd/http/panel/build/_app/immutable
          printf '<!doctype html><title>muelle</title>\n' > src/cmd/http/panel/build/200.html
          printf "default-src 'self'; frame-ancestors 'none'\n" > src/cmd/http/panel/build/csp-header.txt
          go vet -tags panel ./...
          go test -race -tags panel ./src/cmd/http/... ./src/shared/infra/container/
      # Los tests de la action (action/) ya corren en go test; shellcheck viene en ubuntu-latest.
      - name: shellcheck
        run: shellcheck action/deploy.sh

  # El panel (web/): lo mismo que `pnpm verify` y `pnpm build` en local, y los e2e contra
  # el build con MSW. El build sale como artefacto para el job "panel".
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # Sin version: la de packageManager en web/package.json.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      # Los tests de vitest en Chromium (pnpm test) y los e2e lo necesitan.
      - name: Chromium de Playwright
        run: pnpm exec playwright install --with-deps chromium
      # pnpm test y pnpm test:e2e corren en un network namespace propio (unshare -rn,
      # scripts/isolated-net.mjs). Ubuntu restringe los user namespaces sin privilegios con
      # AppArmor; si no se puede, el script avisa y corre con la red del host.
      - name: user namespaces sin privilegios
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: verify (lint, check y test)
        run: pnpm verify
      # Lo mismo que verifica el Dockerfile: el build sin MSW y con lo que lee Go al arrancar.
      - name: build
        env:
          VITE_USE_MOCKS: '0'
        run: |
          pnpm build
          test -f build/200.html
          test -s build/csp-header.txt
          test ! -e build/mockServiceWorker.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: panel-build
          path: web/build/
          if-no-files-found: error
          retention-days: 1
      - name: e2e (contra el build con MSW, bajo la CSP)
        run: pnpm test:e2e

  # Go con el panel de verdad: el build del job "web" copiado en src/cmd/http/panel/build,
  # como lo hace el Dockerfile, y los tests de -tags panel contra él.
  panel:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: panel-build
          path: src/cmd/http/panel/build
      - name: el build trae lo que lee Go al arrancar
        run: |
          test -f src/cmd/http/panel/build/200.html
          test -s src/cmd/http/panel/build/csp-header.txt
          test -d src/cmd/http/panel/build/_app/immutable
      - name: vet y test con -tags panel
        run: |
          go vet -tags panel ./...
          go test -race -tags panel ./src/cmd/http/... ./src/shared/infra/container/
      - name: build con el panel
        run: CGO_ENABLED=0 go build -tags panel -o muelle .

  # El panel contra un muelle de verdad (pnpm test:e2e:real, web/e2e-real/): construye el
  # panel y muelle con -tags panel, y recorre setup, 2FA, catálogo, deploys y rollback contra
  # un Swarm. El runner es efímero: acá sí se crea un Swarm de un nodo (el script nunca lo
  # hace).
  e2e-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - name: pnpm install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Chromium de Playwright
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      # Ver el job web: el e2e real también corre en el network namespace propio.
      - name: user namespaces sin privilegios
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Swarm de un nodo
        run: |
          docker swarm init || docker swarm init --advertise-addr 127.0.0.1
          docker info --format '{{.Swarm.LocalNodeState}} {{.Swarm.ControlAvailable}}'
      - name: e2e real
        working-directory: web
        run: pnpm test:e2e:real
      # La traza de Playwright y el log de muelle (test-results/real-muelle.log).
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-real
          path: web/test-results/
          retention-days: 7
